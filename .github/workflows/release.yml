name: Release

on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: write

jobs:
  deploy_npm_package_and_typedoc:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm to 11.6.2
      run: npm install -g npm@11.6.2

    - uses: pnpm/action-setup@v6.1.0
      with:
        version: 11.24.0

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    # publish만 npm으로 남긴다 — OIDC trusted publishing은 npm CLI 기능이고
    # pnpm publish가 이를 지원한다는 근거를 찾지 못했다(2026-09-11 조사).
    # 배포 경로를 깨면 매니저 통일의 목적과 반대가 되므로 이 줄과 위의 npm 핀은 그대로 둔다.
    - name: Publish to npm via OIDC
      run: npm publish

    - name: Generate Typedoc
      run: pnpm build:typedoc

    - name: Deploy Typedoc to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs